<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>監獄兔基里連科 - 404 越獄跑酷 (Usavich Kirilenko Runner)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', cursive, monospace, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-x-hidden">

  <!-- Header Header -->
  <header class="text-center mb-3 max-w-4xl w-full">
    <div class="flex items-center justify-center space-x-3 mb-1">
      <span class="text-red-500 text-2xl font-bold">★</span>
      <h1 class="text-xl sm:text-3xl text-yellow-400 tracking-wider font-extrabold uppercase drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
        USAVICH: 404 PRISON BREAK
      </h1>
      <span class="text-red-500 text-2xl font-bold">★</span>
    </div>
    <p class="text-xs sm:text-sm text-gray-400">幫基里連科（04號）穿上限量帆布鞋逃出監獄！吃蘿蔔賺高分！</p>
  </header>

  <!-- Main Game Container -->
  <main class="relative w-full max-w-4xl bg-gray-900 border-4 border-red-700 rounded-xl shadow-2xl overflow-hidden">
    
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="900" height="350" class="w-full h-auto block pixelated bg-sky-200"></canvas>

    <!-- Overlay UI (Controls hint on mobile) -->
    <div id="touchControls" class="sm:hidden grid grid-cols-2 gap-2 p-2 bg-gray-900 border-t border-gray-800">
      <button id="btnJump" class="bg-red-600 hover:bg-red-700 active:scale-95 text-white py-3 rounded-lg text-sm font-bold shadow border-b-4 border-red-900 active:border-b-0">
        跳躍 / 二段跳 (▲)
      </button>
      <button id="btnDuck" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3 rounded-lg text-sm font-bold shadow border-b-4 border-blue-900 active:border-b-0">
        蹲下 (▼)
      </button>
    </div>
  </main>

  <!-- Control Instructions Legend -->
  <section class="mt-4 max-w-4xl w-full bg-gray-900 border border-gray-800 p-4 rounded-xl text-xs text-gray-300 grid grid-cols-1 md:grid-cols-3 gap-4 shadow-lg">
    <div class="flex items-center space-x-3 bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
      <div class="text-2xl">👟</div>
      <div>
        <div class="text-yellow-400 font-bold mb-1">限量帆布鞋 (Shoe)</div>
        <div class="text-[11px] text-gray-400">觸發「基里連科暴怒模式」！無敵衝鋒 + 畫面震動毀滅障礙！</div>
      </div>
    </div>
    <div class="flex items-center space-x-3 bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
      <div class="text-2xl">🥕</div>
      <div>
        <div class="text-orange-400 font-bold mb-1">鮮嫩胡蘿蔔 (Carrot)</div>
        <div class="text-[11px] text-gray-400">獲取額外 100 分 bonus 獎勵！</div>
      </div>
    </div>
    <div class="flex items-center space-x-3 bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
      <div class="text-2xl">⌨️</div>
      <div>
        <div class="text-green-400 font-bold mb-1">操作說明</div>
        <div class="text-[11px] text-gray-400">Space / Up: 跳躍 (空中可再按二段跳)<br/>Down: 蹲下閃避無人機</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="mt-4 text-center text-[10px] text-gray-500">
    Usavich Pixel Fan Game • Chrome 404 Runner Edition
  </footer>

  <!-- Game Engine JavaScript -->
  <script>
    // --- Audio System (Web Audio API Synthesizer) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
        
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      playCarrot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }
      playPowerup() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.25);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
        
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        
        osc.start(now);
        osc.stop(now + 0.45);
      }
      playCrash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.35);
        
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const soundFx = new SoundEffects();

    // --- Game Logic Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Constants
    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 350;
    const GROUND_Y = 280;
    const GRAVITY = 0.65;

    // Game state variables
    let gameState = 'START'; // 'START', 'RUNNING', 'GAMEOVER'
    let score = 0;
    let highScore = localStorage.getItem('usavich_high_score') || 0;
    let gameSpeed = 6;
    let frameCount = 0;
    let cameraShake = 0;

    // Day/Night Theme Cycle System
    let themeIndex = 0; // 0: Day, 1: Sunset, 2: Cyber Night
    const themes = [
      { name: 'PRISON YARD', skyTop: '#7dd3fc', skyBot: '#bae6fd', ground: '#78716c', accent: '#3b82f6' },
      { name: 'SUNSET ESCAPE', skyTop: '#fdba74', skyBot: '#f43f5e', ground: '#57534e', accent: '#f97316' },
      { name: 'NEON NIGHT', skyTop: '#0f172a', skyBot: '#312e81', ground: '#292524', accent: '#ec4899' }
    ];

    // --- Kirilenko Character Class ---
    class Kirilenko {
      constructor() {
        this.width = 44;
        this.height = 70;
        this.x = 80;
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
        this.maxJumps = 2;
        this.isDucking = false;
        this.rageTimer = 0; // Invincibility frames from Sneaker
        this.animFrame = 0;
      }

      reset() {
        this.height = 70;
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
        this.isDucking = false;
        this.rageTimer = 0;
      }

      jump() {
        soundFx.init();
        if (this.jumpCount < this.maxJumps) {
          this.vy = -12.5;
          this.isGrounded = false;
          this.jumpCount++;
          soundFx.playJump();
        }
      }

      duck(isDucking) {
        if (this.isGrounded) {
          if (isDucking && !this.isDucking) {
            this.isDucking = true;
            this.height = 42;
            this.y = GROUND_Y - this.height;
          } else if (!isDucking && this.isDucking) {
            this.isDucking = false;
            this.height = 70;
            this.y = GROUND_Y - this.height;
          }
        }
      }

      update() {
        // Physics update
        this.vy += GRAVITY;
        this.y += this.vy;

        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.vy = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }

        // Rage timer update
        if (this.rageTimer > 0) {
          this.rageTimer--;
        }

        // Animation frame increment
        if (frameCount % 6 === 0) {
          this.animFrame = (this.animFrame + 1) % 4;
        }
      }

      draw(ctx) {
        ctx.save();

        // Draw Rage Flame Aura if Sneakers active
        if (this.rageTimer > 0) {
          ctx.fillStyle = (frameCount % 4 < 2) ? '#ef4444' : '#f59e0b';
          ctx.beginPath();
          ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 45, 0, Math.PI * 2);
          ctx.fill();
          
          // Flame particles around Kirilenko
          for(let i = 0; i < 3; i++) {
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(
              this.x + Math.random() * this.width - 5,
              this.y + Math.random() * this.height - 10,
              8, 8
            );
          }
        }

        const kX = this.x;
        const kY = this.y;
        const kw = this.width;
        const kh = this.height;

        // --- DRAW PIXEL ART KIRILENKO (RED RABBIT #04) ---
        if (this.isDucking) {
          // Ducking Pose
          // Body (Red/White Jumpsuit)
          ctx.fillStyle = '#dc2626'; // Deep Red
          ctx.fillRect(kX, kY + 14, 52, 28);
          ctx.fillStyle = '#ffffff'; // White Stripes
          ctx.fillRect(kX + 10, kY + 14, 8, 28);
          ctx.fillRect(kX + 28, kY + 14, 8, 28);

          // Head (Red Fur)
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 32, kY, 22, 22);

          // Pinned Ear
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(kX + 26, kY - 6, 12, 8);
          ctx.fillStyle = '#fbbf24'; // Safety Pin
          ctx.fillRect(kX + 30, kY - 4, 4, 4);

          // Right Ear
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 42, kY - 14, 7, 16);

          // Eyes (Angry Red Eyes)
          ctx.fillStyle = (this.rageTimer > 0) ? '#facc15' : '#7f1d1d';
          ctx.fillRect(kX + 46, kY + 6, 6, 6);
          ctx.fillStyle = '#000';
          ctx.fillRect(kX + 48, kY + 7, 3, 3);

          // Jumpsuit Number "04"
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 8px monospace';
          ctx.fillText('04', kX + 4, kY + 30);
        } else {
          // Standing / Running Pose
          // Left Pinned Ear (Folded with Safety Pin)
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(kX + 4, kY - 16, 14, 18);
          ctx.fillStyle = '#fbbf24'; // Yellow Pin
          ctx.fillRect(kX + 8, kY - 10, 6, 5);

          // Right Normal Tall Ear
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 24, kY - 26, 10, 28);
          ctx.fillStyle = '#fca5a5'; // Ear Inner
          ctx.fillRect(kX + 27, kY - 22, 4, 20);

          // Head
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 6, kY, 32, 26);

          // Angry Eyes
          ctx.fillStyle = (this.rageTimer > 0) ? '#fef08a' : '#7f1d1d';
          ctx.fillRect(kX + 24, kY + 6, 8, 8);
          ctx.fillStyle = '#000000';
          ctx.fillRect(kX + 27, kY + 8, 4, 4);

          // Stern Mouth Expression
          ctx.fillStyle = '#000000';
          ctx.fillRect(kX + 26, kY + 18, 10, 2);

          // Body Jumpsuit (Red & White Vertical Stripes)
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 6, kY + 26, 32, 32);
          ctx.fillStyle = '#ffffff'; // White stripes
          ctx.fillRect(kX + 13, kY + 26, 6, 32);
          ctx.fillRect(kX + 25, kY + 26, 6, 32);

          // Jumpsuit Number "04" Badge
          ctx.fillStyle = '#000000';
          ctx.fillRect(kX + 8, kY + 32, 12, 10);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 7px sans-serif';
          ctx.fillText('04', kX + 9, kY + 40);

          // Legs & Sneaker Footwear
          const legOffset = (this.isGrounded) ? (this.animFrame % 2 === 0 ? 6 : -6) : 0;
          
          // Shoes: Red/White Canvas Shoes
          ctx.fillStyle = (this.rageTimer > 0) ? '#fbbf24' : '#ffffff'; // Glowing shoes during rage
          // Left Foot
          ctx.fillRect(kX + 6 + legOffset, kY + 58, 12, 12);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 6 + legOffset, kY + 58, 12, 6);

          // Right Foot
          ctx.fillStyle = (this.rageTimer > 0) ? '#fbbf24' : '#ffffff';
          ctx.fillRect(kX + 24 - legOffset, kY + 58, 12, 12);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(kX + 24 - legOffset, kY + 58, 12, 6);
        }

        ctx.restore();
      }
    }

    // --- Obstacles Class (Prison themed) ---
    class Obstacle {
      constructor(type) {
        this.type = type; // 'GATE', 'POLICE_CAR', 'DRONE', 'GUARD_BEAR'
        this.markedForDeletion = false;

        if (type === 'GATE') {
          this.width = 36;
          this.height = 60;
          this.y = GROUND_Y - this.height;
        } else if (type === 'POLICE_CAR') {
          this.width = 65;
          this.height = 40;
          this.y = GROUND_Y - this.height;
        } else if (type === 'GUARD_BEAR') {
          this.width = 45;
          this.height = 65;
          this.y = GROUND_Y - this.height;
        } else if (type === 'DRONE') {
          this.width = 45;
          this.height = 30;
          // Drone flies high requiring duck or low jump
          this.y = GROUND_Y - 80;
        }

        this.x = CANVAS_WIDTH + 20;
      }

      update() {
        this.x -= gameSpeed;
        if (this.x + this.width < -50) {
          this.markedForDeletion = true;
        }
      }

      draw(ctx) {
        ctx.save();
        if (this.type === 'GATE') {
          // Soviet Prison Steel Gate / Fence
          ctx.fillStyle = '#475569';
          ctx.fillRect(this.x, this.y, this.width, this.height);
          ctx.fillStyle = '#94a3b8';
          for (let i = 4; i < this.width; i += 8) {
            ctx.fillRect(this.x + i, this.y, 3, this.height);
          }
          // Red Warning Light on top
          ctx.fillStyle = (frameCount % 20 < 10) ? '#ef4444' : '#7f1d1d';
          ctx.fillRect(this.x + this.width/2 - 4, this.y - 8, 8, 8);
        } else if (this.type === 'POLICE_CAR') {
          // Patrol Car
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(this.x, this.y + 12, this.width, 28);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(this.x + 12, this.y + 12, 35, 14);
          ctx.fillStyle = '#000';
          ctx.font = '8px monospace';
          ctx.fillText('POLICE', this.x + 14, this.y + 22);

          // Siren Light Flash
          ctx.fillStyle = (frameCount % 10 < 5) ? '#3b82f6' : '#ef4444';
          ctx.fillRect(this.x + 26, this.y + 4, 12, 8);

          // Wheels
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(this.x + 14, this.y + 38, 8, 0, Math.PI * 2);
          ctx.arc(this.x + 50, this.y + 38, 8, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'GUARD_BEAR') {
          // Guard Bear (Boris & Kolychev)
          ctx.fillStyle = '#1e3a8a'; // Dark blue uniform
          ctx.fillRect(this.x + 8, this.y + 20, 30, 45);
          // Head
          ctx.fillStyle = '#92400e'; // Brown fur
          ctx.fillRect(this.x + 6, this.y, 32, 24);
          // Officer Cap
          ctx.fillStyle = '#1e1b4b';
          ctx.fillRect(this.x + 4, this.y - 6, 36, 8);
          ctx.fillStyle = '#fbbf24'; // Red/Gold star on cap
          ctx.fillRect(this.x + 18, this.y - 4, 4, 4);
          // Baton
          ctx.fillStyle = '#000000';
          ctx.fillRect(this.x - 4, this.y + 25, 14, 6);
        } else if (this.type === 'DRONE') {
          // Flying Surveillance Drone
          ctx.fillStyle = '#334155';
          ctx.fillRect(this.x + 8, this.y + 8, 30, 14);
          // Spinning Propellers
          ctx.fillStyle = '#94a3b8';
          const propOffset = (frameCount % 4 < 2) ? 0 : 4;
          ctx.fillRect(this.x - 2 + propOffset, this.y + 4, 16, 3);
          ctx.fillRect(this.x + 30 - propOffset, this.y + 4, 16, 3);
          // Searchlight Beam
          ctx.fillStyle = 'rgba(254, 240, 138, 0.25)';
          ctx.beginPath();
          ctx.moveTo(this.x + 20, this.y + 22);
          ctx.lineTo(this.x - 15, this.y + 110);
          ctx.lineTo(this.x + 55, this.y + 110);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // --- Collectibles Class (Carrots & Canvas Shoes) ---
    class Item {
      constructor(type) {
        this.type = type; // 'CARROT' or 'SHOE'
        this.x = CANVAS_WIDTH + 20;
        this.width = 28;
        this.height = 28;
        // Spawn at varying jump heights
        this.y = GROUND_Y - 50 - (Math.random() > 0.5 ? 60 : 0);
        this.markedForDeletion = false;
        this.bounceOffset = 0;
      }

      update() {
        this.x -= gameSpeed;
        this.bounceOffset = Math.sin(frameCount * 0.1) * 5;
        if (this.x + this.width < -30) {
          this.markedForDeletion = true;
        }
      }

      draw(ctx) {
        ctx.save();
        const renderY = this.y + this.bounceOffset;

        if (this.type === 'CARROT') {
          // Carrot Graphic
          ctx.fillStyle = '#f97316'; // Orange carrot body
          ctx.beginPath();
          ctx.moveTo(this.x + 5, renderY + 5);
          ctx.lineTo(this.x + 22, renderY + 5);
          ctx.lineTo(this.x + 14, renderY + 25);
          ctx.closePath();
          ctx.fill();
          // Green leaves
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(this.x + 10, renderY, 8, 6);
        } else if (this.type === 'SHOE') {
          // Red Canvas Sneaker
          ctx.fillStyle = '#ef4444'; // Red Canvas
          ctx.fillRect(this.x + 4, renderY + 8, 20, 12);
          ctx.fillStyle = '#ffffff'; // White Rubber Sole
          ctx.fillRect(this.x + 2, renderY + 18, 24, 6);
          ctx.fillRect(this.x + 18, renderY + 10, 8, 12); // Toe Cap
          ctx.fillStyle = '#fbbf24'; // Glowing Aura Star
          ctx.fillRect(this.x + 8, renderY + 11, 4, 4);
        }
        ctx.restore();
      }
    }

    // --- Instantiations & Controls ---
    const player = new Kirilenko();
    let obstacles = [];
    let items = [];

    // Keyboard Events
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (gameState === 'RUNNING') {
          player.jump();
        } else if (gameState === 'START' || gameState === 'GAMEOVER') {
          resetGame();
        }
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (gameState === 'RUNNING') {
          player.duck(true);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        if (gameState === 'RUNNING') {
          player.duck(false);
        }
      }
    });

    // Touch Buttons for Mobile
    document.getElementById('btnJump').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'RUNNING') player.jump();
      else resetGame();
    });
    document.getElementById('btnDuck').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'RUNNING') player.duck(true);
    });
    document.getElementById('btnDuck').addEventListener('touchend', (e) => {
      e.preventDefault();
      if (gameState === 'RUNNING') player.duck(false);
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
      }
    });

    // --- Game Logic Functions ---
    function resetGame() {
      soundFx.init();
      gameState = 'RUNNING';
      score = 0;
      gameSpeed = 6;
      frameCount = 0;
      themeIndex = 0;
      obstacles = [];
      items = [];
      player.reset();
    }

    function triggerCameraShake(intensity) {
      cameraShake = intensity;
    }

    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // --- Main Game Loop ---
    function update() {
      frameCount++;

      if (gameState === 'RUNNING') {
        // Score & Progression Acceleration
        score++;
        if (score % 250 === 0 && gameSpeed < 14) {
          gameSpeed += 0.5;
        }

        // Theme Cycle Every 500 Points (Day -> Sunset -> Night)
        themeIndex = Math.floor(score / 500) % themes.length;

        // Player Update
        player.update();

        // Spawn Obstacles
        if (frameCount % Math.max(45, 110 - Math.floor(gameSpeed * 4)) === 0) {
          const rand = Math.random();
          let type = 'GATE';
          if (rand < 0.3) type = 'GATE';
          else if (rand < 0.6) type = 'POLICE_CAR';
          else if (rand < 0.85) type = 'GUARD_BEAR';
          else type = 'DRONE';
          
          obstacles.push(new Obstacle(type));
        }

        // Spawn Collectible Items (Carrots / Shoes)
        if (frameCount % 180 === 0) {
          const itemType = (Math.random() < 0.25) ? 'SHOE' : 'CARROT';
          items.push(new Item(itemType));
        }

        // Update Obstacles & Collision Check
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();

          // Collision Detection
          if (checkCollision(player, obs)) {
            if (player.rageTimer > 0) {
              // Destroy obstacle during Rage Sneaker Mode
              obstacles.splice(i, 1);
              triggerCameraShake(8);
              soundFx.playCrash();
            } else {
              // Game Over
              soundFx.playCrash();
              gameState = 'GAMEOVER';
              triggerCameraShake(15);
              if (score > highScore) {
                highScore = score;
                localStorage.setItem('usavich_high_score', highScore);
              }
            }
          }

          if (obs.markedForDeletion) obstacles.splice(i, 1);
        }

        // Update Items & Pickups
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.update();

          if (checkCollision(player, item)) {
            if (item.type === 'CARROT') {
              score += 100;
              soundFx.playCarrot();
            } else if (item.type === 'SHOE') {
              player.rageTimer = 300; // ~5 seconds of Rage Invincibility
              soundFx.playPowerup();
            }
            items.splice(i, 1);
          } else if (item.markedForDeletion) {
            items.splice(i, 1);
          }
        }
      }

      // Camera Shake decay
      if (cameraShake > 0) cameraShake *= 0.85;
      if (cameraShake < 0.5) cameraShake = 0;
    }

    function drawBackground(currentTheme) {
      // Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      skyGrad.addColorStop(0, currentTheme.skyTop);
      skyGrad.addColorStop(1, currentTheme.skyBot);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Night Stars / Sunset Details
      if (themeIndex === 2) {
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 20; i++) {
          const sx = (i * 57 + frameCount * 0.2) % CANVAS_WIDTH;
          const sy = (i * 37) % 150;
          ctx.fillRect(sx, sy, 2, 2);
        }
      }

      // Parallax Background Prison Wall / Watchtowers
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      for (let i = 0; i < 5; i++) {
        const wallX = ((i * 220) - (frameCount * (gameSpeed * 0.2))) % (CANVAS_WIDTH + 220);
        ctx.fillRect(wallX, GROUND_Y - 100, 180, 100);
        // Watchtower Searchlight Turrets
        ctx.fillRect(wallX + 70, GROUND_Y - 140, 40, 40);
      }

      // Ground Road
      ctx.fillStyle = currentTheme.ground;
      ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

      // Ground Striping
      ctx.fillStyle = '#e2e8f0';
      const stripeOffset = (frameCount * gameSpeed) % 40;
      for (let x = -stripeOffset; x < CANVAS_WIDTH; x += 40) {
        ctx.fillRect(x, GROUND_Y + 15, 20, 4);
      }
    }

    function render() {
      ctx.save();

      // Apply screen shake
      if (cameraShake > 0) {
        const rx = (Math.random() - 0.5) * cameraShake;
        const ry = (Math.random() - 0.5) * cameraShake;
        ctx.translate(rx, ry);
      }

      const currentTheme = themes[themeIndex];
      drawBackground(currentTheme);

      // Render Items & Obstacles
      items.forEach(item => item.draw(ctx));
      obstacles.forEach(obs => obs.draw(ctx));

      // Render Kirilenko
      player.draw(ctx);

      // UI Score Dashboard Overlay
      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.fillRect(15, 12, 340, 40);
      ctx.strokeStyle = '#dc2626';
      ctx.strokeRect(15, 12, 340, 40);

      ctx.fillStyle = '#facc15';
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.fillText(`SCORE: ${Math.floor(score)}`, 25, 36);

      ctx.fillStyle = '#ffffff';
      ctx.fillText(`HI: ${Math.floor(highScore)}`, 210, 36);

      // Current Zone Badge
      ctx.fillStyle = currentTheme.accent;
      ctx.fillRect(CANVAS_WIDTH - 210, 12, 195, 26);
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(currentTheme.name, CANVAS_WIDTH - 200, 29);

      // State Overlay Screens (Start & Game Over)
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = '#facc15';
        ctx.font = '20px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('USAVICH 404 RUNNER', CANVAS_WIDTH / 2, 130);

        ctx.fillStyle = '#ffffff';
        ctx.font = '12px "Press Start 2P", monospace';
        ctx.fillText('按 空白鍵 (SPACE) 或 點擊螢幕 開始越獄', CANVAS_WIDTH / 2, 190);
        ctx.textAlign = 'left';
      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = '#ef4444';
        ctx.font = '24px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER - 被逮捕！', CANVAS_WIDTH / 2, 120);

        ctx.fillStyle = '#ffffff';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillText(`最終得分: ${Math.floor(score)}`, CANVAS_WIDTH / 2, 170);

        ctx.fillStyle = '#facc15';
        ctx.font = '11px "Press Start 2P", monospace';
        ctx.fillText('按下 SPACE 或 點擊螢幕 重新挑戰', CANVAS_WIDTH / 2, 220);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    // --- Main Loop Initializer ---
    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function() {
      gameLoop();
    };
  </script>
</body>
</html>
